<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Bulk Location Update Scanner</title>

  <!-- QR Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .dropdown-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .field label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    select {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 7px;
      background: white;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .start-btn {
      background: #1976d2;
      color: white;
    }

    .scan-btn {
      background: #2e7d32;
      color: white;
    }

    .submit-btn {
      background: #ef6c00;
      color: white;
    }

    .clear-btn {
      background: #c62828;
      color: white;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    #reader {
      width: 100%;
      margin-top: 15px;
    }

    .status {
      padding: 12px;
      border-radius: 7px;
      margin-top: 10px;
      background: #eef2f5;
    }

    .scan-count {
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      margin: 15px 0;
    }

    .scan-list {
      max-height: 300px;
      overflow-y: auto;
    }

    .scan-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      border-bottom: 1px solid #ddd;
      gap: 10px;
    }

    .scan-number {
      font-weight: bold;
      min-width: 30px;
    }

    .scan-value {
      flex: 1;
      word-break: break-all;
    }

    .remove-btn {
      width: auto;
      margin: 0;
      padding: 6px 10px;
      background: #d32f2f;
      color: white;
      font-size: 12px;
    }

    .hidden {
      display: none;
    }

    .selection-summary {
      font-size: 14px;
      line-height: 1.7;
    }

    @media(max-width: 600px) {

      .dropdown-grid {
        grid-template-columns: 1fr;
      }

      .container {
        padding: 10px;
      }
    }

  </style>

</head>


<body>

<div class="container">

  <h1>Bulk Location Update</h1>


  <!-- =========================================
       LOCATION / DROPDOWN SELECTION
       ========================================= -->

  <div class="card">

    <h3>1. Select Location</h3>

    <div
      id="dropdownContainer"
      class="dropdown-grid"
    ></div>

    <button
      id="startBtn"
      class="start-btn"
      onclick="startScanning()"
    >
      START BULK SCANNING
    </button>

  </div>


  <!-- =========================================
       SCANNER
       ========================================= -->

  <div
    id="scannerCard"
    class="card hidden"
  >

    <h3>2. Scan QR Codes</h3>

    <div class="selection-summary">
      <strong>Current Selection:</strong>

      <div id="selectionSummary"></div>
    </div>

    <div class="scan-count">
      Scanned:
      <span id="scanCount">0</span>
    </div>

    <div id="reader"></div>

    <div
      id="scanStatus"
      class="status"
    >
      Ready to scan.
    </div>

  </div>


  <!-- =========================================
       SCANNED LIST
       ========================================= -->

  <div
    id="listCard"
    class="card hidden"
  >

    <h3>Scanned Items</h3>

    <div
      id="scanList"
      class="scan-list"
    ></div>

    <button
      id="submitBtn"
      class="submit-btn"
      onclick="submitBatch()"
    >
      SUBMIT BATCH
    </button>

    <button
      class="clear-btn"
      onclick="clearBatch()"
    >
      CLEAR BATCH
    </button>

  </div>


  <!-- =========================================
       RESULT
       ========================================= -->

  <div
    id="resultCard"
    class="card hidden"
  >

    <h3>Result</h3>

    <div id="resultMessage"></div>

  </div>

</div>


<script>

/******************************************************
 * CONFIGURATION
 ******************************************************/

/*
 * PUT YOUR APPS SCRIPT WEB APP URL HERE.
 */
const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbzvL4UMzMhOIokRFWc4aLPdO7RcnmJ7YvkzhNvqazp8jHG1EJqkQ7QW2DbSezGOZIGT_g/exec";


/*
 * ====================================================
 * MODULAR DROPDOWNS
 * ====================================================
 *
 * Add/remove dropdowns here.
 *
 * The "name" becomes the Google Sheet column header.
 *
 * Example:
 *
 * {
 *   name: "Building",
 *   options: [
 *     "Production",
 *     "Admin",
 *     "Warehouse"
 *   ]
 * }
 */

const DROPDOWNS = [

  {
    name: "Building",

    options: [
      "Production",
      "Warehouse",
      "Utility",
      "Office"
    ]
  },

  {
    name: "Floor",

    options: [
      "Ground Floor",
      "1st Floor",
      "2nd Floor",
      "3rd Floor"
    ]
  },

  {
    name: "Area",

    options: [
      "Y1",
      "Y2",
      "Y3",
      "Y4",
      "Y5",
      "Y6",
      "Y7"
    ]
  },

  {
    name: "Section",

    options: [
      "Stitching",
      "Cutting",
      "Finishing",
      "Maintenance"
    ]
  }

];


/******************************************************
 * APPLICATION STATE
 ******************************************************/

let scannedItems = [];

let html5QrCode = null;

let scannerRunning = false;


/******************************************************
 * BUILD DROPDOWNS
 ******************************************************/

function buildDropdowns() {

  const container =
    document.getElementById(
      "dropdownContainer"
    );

  container.innerHTML = "";

  DROPDOWNS.forEach(
    (dropdown, index) => {

      const field =
        document.createElement("div");

      field.className = "field";

      const label =
        document.createElement("label");

      label.textContent =
        dropdown.name;

      const select =
        document.createElement("select");

      select.id =
        "dropdown_" + index;

      /*
       * Empty option.
       */
      const emptyOption =
        document.createElement("option");

      emptyOption.value = "";

      emptyOption.textContent =
        "-- Select " +
        dropdown.name +
        " --";

      select.appendChild(
        emptyOption
      );


      /*
       * Actual options.
       */
      dropdown.options.forEach(
        optionValue => {

          const option =
            document.createElement("option");

          option.value =
            optionValue;

          option.textContent =
            optionValue;

          select.appendChild(
            option
          );
        }
      );

      field.appendChild(label);

      field.appendChild(select);

      container.appendChild(field);
    }
  );
}


/******************************************************
 * GET CURRENT DROPDOWN VALUES
 ******************************************************/

function getSelectedDropdowns() {

  return DROPDOWNS.map(
    (dropdown, index) => {

      const select =
        document.getElementById(
          "dropdown_" + index
        );

      return {
        name: dropdown.name,
        value: select.value
      };

    }
  );
}


/******************************************************
 * VALIDATE DROPDOWNS
 ******************************************************/

function validateDropdowns() {

  const selections =
    getSelectedDropdowns();

  for (const selection of selections) {

    if (!selection.value) {

      alert(
        "Please select " +
        selection.name
      );

      return false;
    }
  }

  return true;
}


/******************************************************
 * START SCANNING
 ******************************************************/

function startScanning() {

  if (!validateDropdowns()) {
    return;
  }

  /*
   * Clear previous batch.
   */
  scannedItems = [];

  updateScanList();


  /*
   * Show selected values.
   */
  const selections =
    getSelectedDropdowns();

  const summary =
    document.getElementById(
      "selectionSummary"
    );

  summary.innerHTML =
    selections
      .map(
        item =>
          `<div>
            <strong>${escapeHtml(item.name)}:</strong>
            ${escapeHtml(item.value)}
          </div>`
      )
      .join("");


  document
    .getElementById("scannerCard")
    .classList.remove("hidden");

  document
    .getElementById("listCard")
    .classList.remove("hidden");


  document
    .getElementById("startBtn")
    .disabled = true;


  /*
   * Prevent changing location
   * while scanning.
   */
  DROPDOWNS.forEach(
    (_, index) => {

      document
        .getElementById(
          "dropdown_" + index
        )
        .disabled = true;

    }
  );


  startCamera();
}


/******************************************************
 * START CAMERA
 ******************************************************/

function startCamera() {

  if (scannerRunning) {
    return;
  }

  html5QrCode =
    new Html5Qrcode("reader");


  const config = {

    fps: 10,

    qrbox: function(
      viewfinderWidth,
      viewfinderHeight
    ) {

      const size =
        Math.min(
          viewfinderWidth,
          viewfinderHeight
        ) * 0.70;

      return {
        width: size,
        height: size
      };
    }

  };


  html5QrCode
    .start(
      {
        facingMode: "environment"
      },

      config,

      onScanSuccess,

      onScanError

    )
    .then(() => {

      scannerRunning = true;

      setStatus(
        "Camera ready. Start scanning QR codes."
      );

    })
    .catch(error => {

      console.error(error);

      setStatus(
        "Unable to access camera: " +
        error
      );

    });
}


/******************************************************
 * QR SCAN SUCCESS
 ******************************************************/

function onScanSuccess(decodedText) {

  const qrData =
    String(decodedText).trim();


  if (!qrData) {
    return;
  }


  /*
   * DUPLICATE CHECK
   *
   * Duplicate is only checked
   * against the current batch.
   */
  const duplicate =
    scannedItems.some(
      item =>
        item.qrData === qrData
    );


  if (duplicate) {

    setStatus(
      "⚠ Duplicate QR ignored: " +
      qrData
    );

    /*
     * Don't add duplicate.
     */
    return;
  }


  /*
   * Add to current batch.
   */
  scannedItems.push({
    qrData: qrData
  });


  updateScanList();


  setStatus(
    "✓ Scanned: " +
    qrData
  );


  /*
   * Optional vibration on supported phones.
   */
  if (navigator.vibrate) {
    navigator.vibrate(100);
  }
}


/******************************************************
 * SCAN ERROR
 ******************************************************/

function onScanError(errorMessage) {

  /*
   * Ignore continuous scanner
   * "QR not found" messages.
   */

}


/******************************************************
 * UPDATE SCAN LIST
 ******************************************************/

function updateScanList() {

  const list =
    document.getElementById(
      "scanList"
    );

  const count =
    document.getElementById(
      "scanCount"
    );


  count.textContent =
    scannedItems.length;


  if (scannedItems.length === 0) {

    list.innerHTML =
      "<div>No QR codes scanned yet.</div>";

    return;
  }


  list.innerHTML =
    scannedItems
      .map(
        (item, index) => {

          return `
            <div class="scan-item">

              <div class="scan-number">
                ${index + 1}
              </div>

              <div class="scan-value">
                ${escapeHtml(item.qrData)}
              </div>

              <button
                class="remove-btn"
                onclick="removeScan(${index})"
              >
                Remove
              </button>

            </div>
          `;

        }
      )
      .join("");
}


/******************************************************
 * REMOVE SCAN
 ******************************************************/

function removeScan(index) {

  scannedItems.splice(
    index,
    1
  );

  updateScanList();
}


/******************************************************
 * SUBMIT BATCH
 ******************************************************/

async function submitBatch() {

  if (scannedItems.length === 0) {

    alert(
      "Please scan at least one QR code."
    );

    return;
  }


  const confirmed =
    confirm(
      "Submit " +
      scannedItems.length +
      " scanned item(s)?"
    );


  if (!confirmed) {
    return;
  }


  const submitButton =
    document.getElementById(
      "submitBtn"
    );

  submitButton.disabled = true;

  submitButton.textContent =
    "SUBMITTING...";


  const batchId =
    "BATCH-" +
    new Date()
      .toISOString()
      .replace(
        /[-:.TZ]/g,
        ""
      ) +
    "-" +
    Math.random()
      .toString(36)
      .substring(2, 7)
      .toUpperCase();


  /*
   * Get selected dropdowns.
   */
  const dropdowns =
    getSelectedDropdowns();


  /*
   * Data sent to Apps Script.
   */
  const payload = {

    batchId: batchId,

    dropdowns: dropdowns,

    scans: scannedItems

  };


  try {

    /*
     * IMPORTANT:
     *
     * no-cors allows the GitHub Pages
     * site to POST to Apps Script.
     *
     * We intentionally don't try to read
     * the response here.
     */
    await fetch(
      APPS_SCRIPT_URL,
      {
        method: "POST",

        mode: "no-cors",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify(payload)
      }
    );


    /*
     * With no-cors, the browser doesn't
     * expose the Apps Script response.
     *
     * If fetch completes, we consider
     * the submission sent.
     */
    showResult(
      "Batch sent successfully.<br><br>" +
      "Batch ID: <strong>" +
      escapeHtml(batchId) +
      "</strong><br>" +
      "Scanned items: <strong>" +
      scannedItems.length +
      "</strong>"
    );


    /*
     * Clear current batch after submit.
     */
    scannedItems = [];

    updateScanList();


  } catch (error) {

    console.error(error);

    showResult(
      "❌ Error sending batch.<br><br>" +
      escapeHtml(error.toString())
    );

  } finally {

    submitButton.disabled = false;

    submitButton.textContent =
      "SUBMIT BATCH";
  }
}


/******************************************************
 * CLEAR BATCH
 ******************************************************/

function clearBatch() {

  if (scannedItems.length === 0) {
    return;
  }


  const confirmed =
    confirm(
      "Remove all scanned QR codes?"
    );


  if (!confirmed) {
    return;
  }


  scannedItems = [];

  updateScanList();

  setStatus(
    "Batch cleared."
  );
}


/******************************************************
 * STATUS MESSAGE
 ******************************************************/

function setStatus(message) {

  document
    .getElementById("scanStatus")
    .innerHTML =
      escapeHtml(message);
}


/******************************************************
 * RESULT
 ******************************************************/

function showResult(message) {

  const card =
    document.getElementById(
      "resultCard"
    );

  const result =
    document.getElementById(
      "resultMessage"
    );

  card.classList.remove(
    "hidden"
  );

  result.innerHTML =
    message;
}


/******************************************************
 * HTML ESCAPE
 ******************************************************/

function escapeHtml(value) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}


/******************************************************
 * INITIALIZE
 ******************************************************/

document.addEventListener(
  "DOMContentLoaded",
  () => {

    buildDropdowns();

  }
);

</script>

</body>
</html>
